<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142c52" />
      <stop offset="100%" stop-color="#0b1733" />
    </radialGradient>
    <!-- Circle Gradient -->
    <radialGradient id="circleGrad" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#1b4766" />
      <stop offset="70%" stop-color="#14344d" />
      <stop offset="100%" stop-color="#0e2437" />
    </radialGradient>
    <!-- Neon Lime Gradient -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55f769" />
      <stop offset="100%" stop-color="#28d145" />
    </linearGradient>
    <!-- Yellow Lime Gradient for Text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbfd39" />
      <stop offset="100%" stop-color="#8ceb26" />
    </linearGradient>
    <!-- Cyan Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#4ade80" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Navy Blue Canvas -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Center Circle Backdrop -->
  <circle cx="250" cy="230" r="145" fill="url(#circleGrad)" />

  <!-- Radiating Wifi/Broadcast Waves Inside/Above Cart -->
  <!-- Outer arc -->
  <path d="M 200 185 A 58 58 0 0 1 275 180" fill="none" stroke="#48ea61" stroke-width="11" stroke-linecap="round" />
  <!-- Middle arc -->
  <path d="M 213 203 A 38 38 0 0 1 262 200" fill="none" stroke="#48ea61" stroke-width="9" stroke-linecap="round" />
  <!-- Inner arc -->
  <path d="M 226 220 A 18 18 0 0 1 250 218" fill="none" stroke="#48ea61" stroke-width="7" stroke-linecap="round" />
  <!-- Center dot -->
  <circle cx="236" cy="230" r="4.5" fill="#8bf89c" />

  <!-- Sparkles / Speed dots trailing behind cart -->
  <circle cx="150" cy="275" r="4" fill="#52ea68" opacity="0.85" />
  <circle cx="165" cy="265" r="5" fill="#52ea68" opacity="0.9" />
  <circle cx="158" cy="290" r="6" fill="#52ea68" />
  <circle cx="175" cy="280" r="7" fill="#52ea68" />
  <circle cx="185" cy="295" r="5" fill="#52ea68" />
  <circle cx="170" cy="305" r="4" fill="#52ea68" opacity="0.8" />
  <circle cx="195" cy="310" r="6" fill="#52ea68" />

  <!-- Price Tag on Cart Handle -->
  <!-- Tag string -->
  <path d="M 135 155 Q 160 152 178 170" fill="none" stroke="#6ef680" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,3" />
  <path d="M 178 170 L 172 195" fill="none" stroke="#6ef680" stroke-width="4" stroke-linecap="round" />
  <!-- Tag body (rotated rectangle with cut corners) -->
  <g transform="translate(142, 175) rotate(-22)">
    <polygon points="12,0 38,0 48,15 48,58 0,58 0,15" fill="#7bf84a" stroke="#2db839" stroke-width="3" />
    <circle cx="24" cy="14" r="5" fill="#0e2437" />
    <line x1="12" y1="32" x2="36" y2="32" stroke="#2db839" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="42" x2="28" y2="42" stroke="#2db839" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Shopping Cart Handle -->
  <path d="M 178 170 L 195 200 L 315 180" fill="none" stroke="#48ea61" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Shopping Cart Basket Basket Rim & Body -->
  <polygon points="195,200 328,178 305,275 208,285" fill="none" stroke="#48ea61" stroke-width="9" stroke-linejoin="round" />
  
  <!-- Basket Wire Grid -->
  <!-- Vertical wire ribs -->
  <line x1="220" y1="196" x2="228" y2="283" stroke="#48ea61" stroke-width="4" />
  <line x1="242" y1="193" x2="248" y2="281" stroke="#48ea61" stroke-width="4" />
  <line x1="264" y1="189" x2="268" y2="279" stroke="#48ea61" stroke-width="4" />
  <line x1="286" y1="185" x2="288" y2="277" stroke="#48ea61" stroke-width="4" />
  <line x1="308" y1="182" x2="300" y2="260" stroke="#48ea61" stroke-width="4" />
  <!-- Horizontal wire ribs -->
  <line x1="200" y1="225" x2="320" y2="205" stroke="#48ea61" stroke-width="4" />
  <line x1="204" y1="252" x2="313" y2="235" stroke="#48ea61" stroke-width="4" />

  <!-- Cart Undercarriage Chassis -->
  <path d="M 215 285 L 230 312 L 295 305 L 305 275" fill="none" stroke="#48ea61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cart Wheels -->
  <!-- Left Wheel -->
  <g transform="translate(230, 312)">
    <circle cx="0" cy="0" r="18" fill="#14344d" stroke="#48ea61" stroke-width="6" />
    <circle cx="0" cy="0" r="7" fill="#8bf89c" />
  </g>
  <!-- Right Wheel -->
  <g transform="translate(295, 305)">
    <circle cx="0" cy="0" r="18" fill="#14344d" stroke="#48ea61" stroke-width="6" />
    <circle cx="0" cy="0" r="7" fill="#8bf89c" />
  </g>

  <!-- Green swoosh under cart -->
  <path d="M 160 320 Q 250 355 355 320" fill="none" stroke="#2cd44a" stroke-width="6" stroke-linecap="round" opacity="0.9" />

  <!-- Curved Path for ONLINE SHOP T.M Text -->
  <path id="textArc" d="M 70 340 Q 250 445 430 340" fill="none" />

  <!-- ONLINE SHOP T.M Bold Green Font -->
  <text font-family="system-ui, -apple-system, 'Segoe UI', Impact, Arial Black, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="3">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      ONLINE SHOP T.M
    </textPath>
  </text>

  <!-- EASY SOLUTION Cyan Subtitle -->
  <text x="250" y="428" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="20" fill="#38bdf8" letter-spacing="5">
    EASY SOLUTION
  </text>
</svg>
